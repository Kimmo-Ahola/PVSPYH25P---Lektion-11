{% extends "user/layout.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

<div class="container mt-5">
    <div class="row justify-content-center">
        <!-- Här skapar vi den gråa/vita rutan (Card) så den inte bara är en vit vägg -->
        <div class="col-md-4 card p-5 shadow-lg border-success">
            <h2 class="text-center text-success mb-4">Kundinloggning</h2>
            <p class="text-muted text-center small">Logga in med ditt personnummer för att se dina konton.</p>
            
            <form method="POST" class="mt-3">
                <div class="mb-4">
                    <label class="form-label font-weight-bold">Personnummer</label>
                    <input type="text" name="national_id" 
                           class="form-control form-control-lg" 
                           placeholder="YYYYMMDD-XXXX" required>
                </div>
                
                <button type="submit" class="btn btn-success btn-lg w-100 shadow-sm">
                    Visa mina konton
                </button>
            </form>

            <div class="mt-4 text-center">
                <a href="{{ url_for('login_choice') }}" class="text-decoration-none">
                    <small>&larr; Tillbaka till val</small>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
